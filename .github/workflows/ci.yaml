name: "[CI] Lint, build & publish"

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Head build — {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-team-name-game:
    uses: bcit-tlu/.github/.github/workflows/oci-build.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      component: team-name-game
      image_name: team-name-game
      context: .
      tag_prefix: "v"
    secrets: inherit
