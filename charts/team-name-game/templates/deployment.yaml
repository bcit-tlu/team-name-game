apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "team-name-game.fullname" . }}
  labels:
    {{- include "team-name-game.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "team-name-game.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-name-game.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "team-name-game.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $aff := deepCopy (.Values.affinity | default dict) }}
      {{- if .Values.zoneAntiAffinity.enabled }}
        {{- $zoneRule := dict "labelSelector" (dict "matchLabels" (include "team-name-game.selectorLabels" . | fromYaml)) "topologyKey" .Values.zoneAntiAffinity.topologyKey }}
        {{- $existing := list }}
        {{- if and (hasKey $aff "podAntiAffinity") $aff.podAntiAffinity }}
          {{- $existing = $aff.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution | default list }}
        {{- end }}
        {{- $merged := dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (append $existing $zoneRule)) }}
        {{- $aff = mustMergeOverwrite $aff $merged }}
      {{- end }}
      {{- if $aff }}
      affinity:
        {{- toYaml $aff | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            # Display version surfaced by /api/version and the Admin
            # page. Rendered from `.Values.image.tag | default
            # .Chart.AppVersion` with the main-build `-rc.<ts>.`
            # timestamp segment stripped (see the
            # `team-name-game.displayVersion` helper). Supplying the
            # value at deploy time rather than baking it as a build-arg
            # keeps retag-promoted production images (same digest,
            # different tag under `release-retag.yaml`) displaying a
            # clean `<ver>` while the main-build `latest` env renders
            # `<ver>-rc.<short>`.
            - name: APP_VERSION
              value: {{ include "team-name-game.displayVersion" . | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.collectorEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "team-name-game"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            {{- end }}
            {{- if .Values.reportIssue.enabled }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.reportIssue.existingSecret | default (printf "%s-report-issue-pat" (include "team-name-game.fullname" .)) }}
                  key: token
            - name: GITHUB_REPO
              value: {{ .Values.reportIssue.githubRepo | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
