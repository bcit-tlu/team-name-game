replicaCount: 1

image:
  repository: ghcr.io/bcit-tlu/team-name-game/team-name-game
  pullPolicy: IfNotPresent
  tag: "" # Defaults to .Chart.AppVersion

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: team-name-game.ltc.bcit.ca
      paths:
        - path: /
          pathType: Prefix
  tls: []

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 5

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ── Issue reporting (GitHub PAT) ─────────────────────────────
# The server creates GitHub Issues from user feedback via
# POST /api/issues.  It needs a GitHub PAT with Issues
# read/write scope on the target repository.
#
# Secret resolution order:
#   1. reportIssue.existingSecret  → operator-managed K8s Secret
#   2. Neither                     → chart does not inject env vars
#
# To supply a PAT:
#   kubectl create secret generic team-name-game-report-issue-pat \
#     --from-literal=token=ghp_YOUR_SCOPED_PAT -n team-name-game
#   then set reportIssue.existingSecret: team-name-game-report-issue-pat
reportIssue:
  enabled: false
  githubRepo: "bcit-tlu/team-name-game"
  existingSecret: ""

# ── High-availability / topology spreading ────────────────────
# When enabled, adds a required pod anti-affinity rule so that no two
# replicas land in the same topology zone (e.g. datacenter).
# Requires nodes to be labeled with the chosen topologyKey.
# NOTE: replicaCount must not exceed the number of distinct zones,
# otherwise excess pods will remain Pending (hard scheduling constraint).
zoneAntiAffinity:
  enabled: false
  topologyKey: topology.kubernetes.io/zone

# ── OpenTelemetry instrumentation ────────────────────────────────
observability:
  openTelemetry:
    enabled: false
    serviceName: team-name-game
    exporter:
      traces: otlp
      metrics: otlp
      logs: otlp
      endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
      protocol: http/protobuf

nodeSelector: {}
tolerations: []
affinity: {}
